name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    uses: LegionForge/dev-rig/.github/workflows/lint.yml@dbc782028577aef46e21c674a807efce9b5b9007
    with:
      source-dirs: "harness metrics"

  test:
    uses: LegionForge/dev-rig/.github/workflows/test.yml@dbc782028577aef46e21c674a807efce9b5b9007
    with:
      coverage-source: "harness"
      # Nearly every test in this suite requires a live Hermes SSH host and
      # skips cleanly in CI without one (see conftest.py's hermes_ssh_host
      # fixture). 40 is the realistic floor for what CI alone exercises;
      # full coverage requires running against a live backend.
      coverage-threshold: 40

  sast:
    uses: LegionForge/dev-rig/.github/workflows/sast.yml@dbc782028577aef46e21c674a807efce9b5b9007
    with:
      source-dirs: "harness metrics"
      semgrep-configs: "p/python p/secrets"
    permissions:
      contents: read
      security-events: write
      actions: read

  audit:
    uses: LegionForge/dev-rig/.github/workflows/audit.yml@dbc782028577aef46e21c674a807efce9b5b9007

  secrets:
    uses: LegionForge/dev-rig/.github/workflows/secrets.yml@dbc782028577aef46e21c674a807efce9b5b9007
    permissions:
      contents: read

  sbom:
    uses: LegionForge/dev-rig/.github/workflows/sbom.yml@dbc782028577aef46e21c674a807efce9b5b9007

  trivy:
    uses: LegionForge/dev-rig/.github/workflows/trivy.yml@dbc782028577aef46e21c674a807efce9b5b9007
    permissions:
      security-events: write
      contents: read
